version: "3.8"

networks:
  roberto-dev-net:
    driver: bridge

services:
  # ── LOCAL DB ──
  postgres:
    image: postgres:16-alpine
    container_name: roberto-dev-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: roberto_dev
      POSTGRES_USER: roberto_dev_user
      POSTGRES_PASSWORD: devpassword
    volumes:
      - dev_db_data:/var/lib/postgresql/data
    networks:
      - roberto-dev-net

  # ── LOCAL REDIS ──
  redis:
    image: redis:7-alpine
    container_name: roberto-dev-redis
    ports:
      - "6379:6379"
    networks:
      - roberto-dev-net

  # ── EXPRESS API BACKEND (HOT-RELOADED) ──
  backend:
    build:
      context: ./Robarto_Backend
      dockerfile: Dockerfile
    container_name: roberto-dev-backend
    volumes:
      - ./Robarto_Backend:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://roberto_dev_user:devpassword@postgres:5432/roberto_dev?schema=public
      REDIS_URL: redis://redis:6379
      PORT: 8001
      NODE_ENV: development
    command: npm run dev
    depends_on:
      - postgres
      - redis
    networks:
      - roberto-dev-net

  # ── AI CHATBOT (HOT-RELOADED) ──
  ai-chatbot:
    build:
      context: ./ai-chatbot
      dockerfile: Dockerfile
    container_name: roberto-dev-ai-chatbot
    volumes:
      - ./ai-chatbot:/app
    ports:
      - "8005:8005"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ROBERTO_API_BASE: http://backend:8001/api
    command: uvicorn main:app --host 0.0.0.0 --port 8005 --reload
    networks:
      - roberto-dev-net

  # ── PRISMA STUDIO (DEVELOPER TOOLING ONLY) ──
  prisma-studio:
    image: node:20-alpine
    container_name: roberto-dev-studio
    working_dir: /app
    volumes:
      - ./Robarto_Backend:/app
    ports:
      - "5555:5555"
    environment:
      DATABASE_URL: postgresql://roberto_dev_user:devpassword@postgres:5432/roberto_dev?schema=public
    command: npx prisma studio --browser none
    depends_on:
      - postgres
    networks:
      - roberto-dev-net

volumes:
  dev_db_data:
