# =====================================================
# HTTP -> HTTPS Redirect
# =====================================================

server {
    listen 80;
    server_name omnirraai.com www.omnirraai.com;

    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name api.omnirraai.com;

    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name voice-agent.omnirraai.com;

    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name chatbot.omnirraai.com;

    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name dashboard.omnirraai.com;

    return 301 https://$host$request_uri;
}

# =====================================================
# Landing Page
# =====================================================

server {

    listen 443 ssl http2;
    server_name omnirraai.com www.omnirraai.com;

    ssl_certificate     /etc/letsencrypt/live/omnirraai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/omnirraai.com/privkey.pem;

    client_max_body_size 100M;

    location / {

        proxy_pass http://landing:3000;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# =====================================================
# Backend API
# =====================================================

server {

    listen 443 ssl http2;
    server_name api.omnirraai.com;

    ssl_certificate     /etc/letsencrypt/live/omnirraai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/omnirraai.com/privkey.pem;

    client_max_body_size 100M;

    location / {

        proxy_pass http://backend:8001;

        proxy_http_version 1.1;

        proxy_buffering off;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

